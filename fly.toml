app = "window-watch-ollie"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "Europe/London"
  BUILDING_PROFILE = "uninsulated"
  # Measured off the map: the south windows face exactly 160°. Drives all live solar
  # projections and advisory timing; the daily refit also reports an *effective*
  # bearing (~139° — east of geometric because the solid wall responds with a lag).
  FACADE_AZ = "160"
  # Zone label -> SwitchBot deviceId. DeviceIds are not secret (only SWITCHBOT_TOKEN/
  # SWITCHBOT_SECRET are, set via `fly secrets set`). Read off via list_switchbot_devices()
  # 2026-08-13; sensors were pre-named during pairing (see plan-yea-sprightly-pnueli.md,
  # "Device identification & setup") so no ambiguity to warm-test — but still worth
  # spot-checking one zone after deploy before trusting the data fully.
  #
  # These keys are the schema: they become the JSON keys of the history CSV's `zones`
  # column and the dashboard's location labels. Renaming one deliberately breaks the
  # series at that point — which is the *intended* way to mark a sensor relocation, since
  # `zones` has no provenance column of its own (contrast outdoor_source). Two rules:
  #   - NEVER rename "outside": window_watch.py's outdoor pick looks up that literal
  #     string. Rename it and outdoor_c silently reverts to Open-Meteo with no error.
  #   - Physical locations, as of 2026-08-16 (labels are historical, not descriptive):
  #       "outside"            -> outside the BEDROOM sill, NORTH facade, permanently
  #                               shaded. App-renamed to "north window" 2026-08-16; the
  #                               sensor itself has never moved.
  #       "south_window"       -> was "hallway_upstairs" (upstairs hallway) until
  #                               2026-08-16 ~10:40Z, when it moved to the south window
  #                               (160°, same facade as the lounge). Rows before that
  #                               boundary carry the old key; do not pool the two.
  SWITCHBOT_DEVICES = '{"bedroom":"E873BA8E87E2","outside":"E59004066234","hallway_downstairs":"E49000C62351","south_window":"E49001C6103E","loft":"E59003866417"}'

[[mounts]]
  source = "window_watch_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  auto_stop_machines = "off"
  auto_start_machines = false
  force_https = true

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
